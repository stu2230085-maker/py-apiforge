[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-apiforge"
version = "1.0.0"
description = "Zero-dependency declarative REST API micro-framework, OpenAPI 3.1 generator, JWT/HMAC security, token-bucket rate limiter, and SQLite task/webhook engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "stu2230085-maker", email = "stu2230085-maker@users.noreply.github.com" }
]
keywords = ["api", "rest", "openapi", "jwt", "webhook", "ratelimit", "sqlite", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
apiforge = "apiforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
