name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration test suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Verify CLI commands and OpenAPI 3.1 schema generation
        run: |
          PYTHONPATH=src python3 -m apiforge routes
          PYTHONPATH=src python3 -m apiforge openapi --output /tmp/openapi.json
          python3 -c "import json; data = json.load(open('/tmp/openapi.json')); assert data['openapi'] == '3.1.0'"
